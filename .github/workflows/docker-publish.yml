name: Publicar imagen

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validar nombre de imagen
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
        run: |
          if [[ ! "$DOCKER_IMAGE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "Configura la variable DOCKER_IMAGE con el nombre del repositorio en Docker Hub."
            exit 1
          fi
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4
      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest
